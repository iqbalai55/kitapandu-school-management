services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ksma
      POSTGRES_PASSWORD: ksma
      POSTGRES_DB: ksma
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksma -d ksma"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p local/ksma-attachments || true
        mc anonymous set none local/ksma-attachments
        echo "MinIO bucket ksma-attachments ready"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      KITAPANDU_POSTGRES_DSN: postgresql+asyncpg://ksma:ksma@postgres:5432/ksma
    command: uvicorn ksma.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    volumes: [".:/app"]

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      KITAPANDU_POSTGRES_DSN: postgresql+asyncpg://ksma:ksma@postgres:5432/ksma
    command: python -m ksma.shared.outbox.run

volumes:
  pgdata:
  miniodata: